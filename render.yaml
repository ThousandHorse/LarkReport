services:
  - type: worker          # HTTP サーバーではなくバックグラウンドワーカーとして起動
    name: zeny-slack-modal
    runtime: node
    buildCommand: npm ci
    startCommand: npm run zeny-modal
    plan: free            # 無料プラン
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false       # Render ダッシュボードで手動設定
      - key: SLACK_APP_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: ZENY_SPREADSHEET_ID
        sync: false
      - key: ZAIM_CLIENT_ID
        sync: false
      - key: ZAIM_CLIENT_SECRET
        sync: false
      - key: ZAIM_ACCESS_TOKEN
        sync: false
      - key: ZAIM_ACCESS_TOKEN_SECRET
        sync: false
